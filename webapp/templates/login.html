<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeid Medical - Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1F0A;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 20px;
  }
  .tarjeta {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px;
    color: #7DD44A;
  }
  p.subtitulo {
    color: rgba(255, 255, 255, 0.65);
    font-size: 14px;
    margin: 0 0 28px;
  }
  input[type=password] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 16px;
    margin-bottom: 16px;
  }
  input[type=password]::placeholder { color: rgba(255, 255, 255, 0.4); }
  input[type=password]:focus { outline: none; border-color: #459F18; }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: #459F18;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #3a861d; }
  .error {
    background: rgba(184, 33, 5, 0.15);
    border: 1px solid rgba(184, 33, 5, 0.4);
    color: #ff8a73;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <h1>Zeid Medical</h1>
    <p class="subtitulo">Herramientas F.41 — acceso restringido</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="password" name="password" placeholder="Contraseña" autofocus required>
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
