<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF a Excel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef2f7;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .tarjeta {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 40px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    color: #1a2b4c;
    text-align: center;
  }
  p.subtitulo {
    text-align: center;
    color: #5a6b8c;
    margin: 0 0 28px;
    font-size: 16px;
  }
  .mensaje {
    display: none;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 15px;
  }
  .mensaje.error {
    background: #fff4e5;
    border: 1px solid #f0c36d;
    color: #7a4a00;
  }
  .mensaje.exito {
    background: #e6f7ee;
    border: 1px solid #6fcf97;
    color: #1e7a46;
  }
  .zona {
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px dashed #b7c3dd;
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .zona:hover, .zona.sobre {
    background: #f4f8ff;
    border-color: #4f7cff;
  }
  .zona svg { margin-bottom: 12px; }
  .zona .texto-principal {
    font-size: 18px;
    color: #1a2b4c;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .zona .texto-secundario {
    font-size: 14px;
    color: #8291ab;
  }
  #nombre-archivo {
    margin-top: 16px;
    font-size: 15px;
    color: #1a2b4c;
    font-weight: 600;
    display: none;
  }
  input[type=file] { display: none; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: #4f7cff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #3a63e0; }
  button:disabled { background: #b7c3dd; cursor: not-allowed; }
  #cargando {
    display: none;
    text-align: center;
    margin-top: 18px;
    color: #5a6b8c;
    font-size: 15px;
  }
  #resultados {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }
  .boton-descarga {
    display: block;
    text-align: center;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #2fa76a;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .boton-descarga:hover { background: #248a56; }
  @media (prefers-color-scheme: dark) {
    body { background: #10131a; }
    .tarjeta { background: #1b2030; box-shadow: none; }
    h1 { color: #eef2f7; }
    p.subtitulo { color: #9aa8c7; }
    .zona { border-color: #333d55; }
    .zona:hover, .zona.sobre { background: #232a3d; border-color: #4f7cff; }
    .zona .texto-principal { color: #eef2f7; }
    #nombre-archivo { color: #eef2f7; }
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <h1>Pedido de Cotización → Excel</h1>
    <p class="subtitulo">Subí el PDF del F.41 y descargá la planilla lista para cotizar.</p>

    <div class="mensaje" id="mensaje"></div>

    <form id="formulario" action="/convertir" method="post" enctype="multipart/form-data">
      <label class="zona" id="zona" for="archivo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4f7cff" stroke-width="1.8">
          <path d="M12 3v12m0-12 4 4m-4-4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="texto-principal">Hacé clic o arrastrá el PDF acá</div>
        <div class="texto-secundario">Solo archivos .pdf</div>
        <div id="nombre-archivo"></div>
      </label>
      <input type="file" id="archivo" name="pdf" accept="application/pdf,.pdf" required>
      <button type="submit" id="boton" disabled>Convertir a Excel</button>
    </form>
    <div id="cargando">Convirtiendo, un momento…</div>
    <div id="resultados"></div>
  </div>

<script>
  const zona = document.getElementById('zona');
  const input = document.getElementById('archivo');
  const nombre = document.getElementById('nombre-archivo');
  const boton = document.getElementById('boton');
  const formulario = document.getElementById('formulario');
  const cargando = document.getElementById('cargando');
  const mensaje = document.getElementById('mensaje');
  const resultados = document.getElementById('resultados');

  function mostrarArchivo(file) {
    if (!file) return;
    nombre.textContent = '📄 ' + file.name;
    nombre.style.display = 'block';
    boton.disabled = false;
  }

  function ocultarMensaje() {
    mensaje.style.display = 'none';
  }

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = 'mensaje ' + tipo;
    mensaje.style.display = 'block';
  }

  function resetearFormulario() {
    formulario.reset();
    nombre.style.display = 'none';
    boton.disabled = true;
    boton.textContent = 'Convertir a Excel';
    cargando.style.display = 'none';
  }

  input.addEventListener('change', () => mostrarArchivo(input.files[0]));

  ['dragenter', 'dragover'].forEach(evento =>
    zona.addEventListener(evento, e => {
      e.preventDefault();
      zona.classList.add('sobre');
    })
  );
  ['dragleave', 'drop'].forEach(evento =>
    zona.addEventListener(evento, e => {
      e.preventDefault();
      zona.classList.remove('sobre');
    })
  );
  zona.addEventListener('drop', e => {
    const archivos = e.dataTransfer.files;
    if (archivos.length) {
      input.files = archivos;
      mostrarArchivo(archivos[0]);
    }
  });

  function base64AArchivo(base64, tipoMime) {
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    return new Blob([bytes], { type: tipoMime });
  }

  formulario.addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarMensaje();
    resultados.innerHTML = '';
    boton.disabled = true;
    boton.textContent = 'Convirtiendo…';
    cargando.style.display = 'block';

    try {
      const datos = new FormData(formulario);
      const respuesta = await fetch('/convertir', { method: 'POST', body: datos });
      const cuerpo = await respuesta.json().catch(() => ({}));

      if (!respuesta.ok) {
        mostrarMensaje(cuerpo.error || 'Ocurrió un error al convertir el archivo.', 'error');
        boton.disabled = false;
        boton.textContent = 'Convertir a Excel';
        cargando.style.display = 'none';
        return;
      }

      cargando.style.display = 'none';

      (cuerpo.archivos || []).forEach(archivo => {
        const blob = base64AArchivo(
          archivo.datos,
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        );
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = archivo.nombre;
        enlace.className = 'boton-descarga';
        enlace.textContent = '⬇️ Descargar ' + archivo.etiqueta;
        resultados.appendChild(enlace);
      });

      mostrarMensaje('✅ Listo, descargá los archivos de abajo. Ya podés subir otro PDF.', 'exito');
      resetearFormulario();
    } catch (err) {
      cargando.style.display = 'none';
      mostrarMensaje('No se pudo conectar con la página. Volvé a intentar.', 'error');
      boton.disabled = false;
      boton.textContent = 'Convertir a Excel';
    }
  });
</script>
</body>
</html>
