<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF a Excel</title>
<link rel="stylesheet" href="https://bossanova.uk/jspreadsheet/v5/jspreadsheet.css" type="text/css">
<link rel="stylesheet" href="https://jsuites.net/v5/jsuites.css" type="text/css">
<script src="https://bossanova.uk/jspreadsheet/v5/jspreadsheet.js"></script>
<script src="https://jsuites.net/v5/jsuites.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: #eef2f7;
    color: #1a2b4c;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 40px 16px;
  }
  .contenedor {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
  }
  .tarjeta {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 40px;
    width: 100%;
  }
  .ancho-angosto {
    max-width: 520px;
    margin: 0 auto;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    color: #1a2b4c;
    text-align: center;
  }
  h2 {
    font-size: 20px;
    margin: 0 0 6px;
    color: #1a2b4c;
    text-align: center;
  }
  p.subtitulo {
    text-align: center;
    color: #5a6b8c;
    margin: 0 0 28px;
    font-size: 16px;
  }
  .mensaje {
    display: none;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 15px;
  }
  .mensaje.error {
    background: #fff4e5;
    border: 1px solid #f0c36d;
    color: #7a4a00;
  }
  .mensaje.exito {
    background: #e6f7ee;
    border: 1px solid #6fcf97;
    color: #1e7a46;
  }
  .zona {
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px dashed #b7c3dd;
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .zona:hover, .zona.sobre {
    background: #f4f8ff;
    border-color: #4f7cff;
  }
  .zona svg { margin-bottom: 12px; }
  .zona .texto-principal {
    font-size: 18px;
    color: #1a2b4c;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .zona .texto-secundario {
    font-size: 14px;
    color: #8291ab;
  }
  #nombre-archivo {
    margin-top: 16px;
    font-size: 15px;
    color: #1a2b4c;
    font-weight: 600;
    display: none;
  }
  input[type=file] { display: none; }
  .campo-archivo {
    margin-bottom: 16px;
  }
  .campo-archivo label.etiqueta-campo {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #1a2b4c;
    margin-bottom: 6px;
  }
  .campo-archivo .selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 2px dashed #b7c3dd;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .campo-archivo .selector:hover {
    background: #f4f8ff;
    border-color: #4f7cff;
  }
  .campo-archivo .selector .nombre {
    font-size: 14px;
    color: #5a6b8c;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .campo-archivo .selector .boton-elegir {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: #4f7cff;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: #4f7cff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #3a63e0; }
  button:disabled { background: #b7c3dd; cursor: not-allowed; }
  .cargando {
    display: none;
    text-align: center;
    margin-top: 18px;
    color: #5a6b8c;
    font-size: 15px;
  }
  .resultados {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }
  .boton-descarga {
    display: block;
    text-align: center;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #2fa76a;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .boton-descarga:hover { background: #248a56; }

  .titulo-comparacion {
    font-family: "Courier New", Courier, monospace;
    font-weight: 700;
    text-align: center;
    background: #d4ea6b;
    color: #33430f;
    border-radius: 8px;
    padding: 10px;
    margin: 0 0 14px;
  }
  .grilla-comparacion-wrap {
    border: 1px solid #dbe1e8;
    border-radius: 10px;
  }
  /* La grilla de jspreadsheet siempre dibuja su propio fondo claro (blanco
     / gris clarito), sin importar el tema de la página. Si dejamos que el
     texto herede nuestro color de modo oscuro (casi blanco), queda texto
     claro sobre fondo claro y no se lee. Por eso el color de letra de la
     grilla se fija siempre, en los dos temas. */
  .grilla-comparacion-wrap table,
  .grilla-comparacion-wrap td,
  .grilla-comparacion-wrap th {
    color: #1a2b4c;
  }
  .fila-botones-comparar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    max-width: 520px;
    margin: 24px auto 0;
    padding: 10px 0;
    position: sticky;
    top: 0;
    z-index: 5;
    background: #ffffff;
    border-bottom: 1px solid #eef2f7;
  }
  .fila-botones-comparar button {
    width: auto;
    flex: 1;
    margin-top: 0;
  }
  .opcion-modo-manual {
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #5a6b8c;
    cursor: pointer;
  }
  .opcion-modo-manual input { margin: 0; cursor: pointer; }
  .agregar-item-envoltorio {
    position: relative;
    flex: 1;
  }
  .agregar-item-envoltorio button { width: 100%; }
  .panel-agregar-item {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 340px;
    max-width: 90vw;
    background: #ffffff;
    border: 1px solid #dbe1e8;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 10px;
    z-index: 20;
  }
  .panel-agregar-item input[type=text] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #b7c3dd;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
  }
  .resultados-agregar-item {
    max-height: 260px;
    overflow-y: auto;
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  /* Selector con .panel-agregar-item adelante a propósito: más específico
     que ".fila-botones-comparar button" (que le pondría flex:1 y
     estiraría cada resultado para repartirse el alto de la lista). */
  .panel-agregar-item .resultado-agregar-item {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px 8px;
    cursor: pointer;
    font-size: 13px;
    color: #1a2b4c;
    width: 100%;
    flex: none;
    margin-top: 0;
  }
  .panel-agregar-item .resultado-agregar-item:hover { background: #f4f8ff; border-color: #4f7cff; }
  .resultado-agregar-item-vacio {
    color: #8291ab;
    font-size: 13px;
    margin: 6px 2px 2px;
  }
  .ayuda-formulas {
    text-align: center;
    color: #8291ab;
    font-size: 13px;
    margin: 10px 0 0;
  }
  .boton-descarga-discreta {
    display: block;
    width: auto;
    margin: 14px auto 0;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    color: #5a6b8c;
    background: transparent;
    border: 1px solid #b7c3dd;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .boton-descarga-discreta:hover { background: #f4f8ff; border-color: #4f7cff; color: #4f7cff; }
  .boton-descarga-discreta:disabled { background: transparent; color: #b7c3dd; border-color: #dbe1e8; cursor: not-allowed; }

  @media (prefers-color-scheme: dark) {
    body { background: #10131a; color: #eef2f7; }
    .tarjeta { background: #1b2030; box-shadow: none; }
    h1, h2 { color: #eef2f7; }
    p.subtitulo { color: #9aa8c7; }
    .zona { border-color: #333d55; }
    .zona:hover, .zona.sobre { background: #232a3d; border-color: #4f7cff; }
    .zona .texto-principal { color: #eef2f7; }
    #nombre-archivo { color: #eef2f7; }
    .campo-archivo label.etiqueta-campo { color: #eef2f7; }
    .campo-archivo .selector { border-color: #333d55; }
    .campo-archivo .selector:hover { background: #232a3d; border-color: #4f7cff; }
    .fila-botones-comparar { background: #1b2030; border-bottom-color: #262c3d; }
    .opcion-modo-manual { color: #9aa8c7; }
    .panel-agregar-item { background: #1b2030; border-color: #333d55; }
    .panel-agregar-item input[type=text] { background: #10131a; border-color: #333d55; color: #eef2f7; }
    .panel-agregar-item .resultado-agregar-item { color: #eef2f7; }
    .panel-agregar-item .resultado-agregar-item:hover { background: #232a3d; border-color: #4f7cff; }
    .resultado-agregar-item-vacio { color: #6b7793; }
    .grilla-comparacion-wrap { border-color: #333d55; }
    .titulo-comparacion { background: #3a4522; color: #d4ea6b; }
    .ayuda-formulas { color: #6b7793; }
    .boton-descarga-discreta { color: #9aa8c7; border-color: #333d55; }
    .boton-descarga-discreta:hover { background: #232a3d; border-color: #4f7cff; color: #eef2f7; }
    .boton-descarga-discreta:disabled { color: #4a5570; border-color: #262c3d; }
  }
</style>
</head>
<body>
<div class="contenedor">

  <div class="tarjeta">
    <div class="ancho-angosto">
      <h1>Pedido de Cotización → Excel</h1>
      <p class="subtitulo">Subí el PDF del F.41 y descargá la planilla lista para cotizar.</p>

      <div class="mensaje" id="mensaje"></div>

      <form id="formulario" action="/convertir" method="post" enctype="multipart/form-data">
        <label class="zona" id="zona" for="archivo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4f7cff" stroke-width="1.8">
            <path d="M12 3v12m0-12 4 4m-4-4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="texto-principal">Hacé clic o arrastrá el PDF acá</div>
          <div class="texto-secundario">Solo archivos .pdf</div>
          <div id="nombre-archivo"></div>
        </label>
        <input type="file" id="archivo" name="pdf" accept="application/pdf,.pdf" required>
        <button type="submit" id="boton" disabled>Convertir a Excel</button>
      </form>
      <div class="cargando" id="cargando">Convirtiendo, un momento…</div>
      <div class="resultados" id="resultados"></div>
    </div>
  </div>

  <div class="tarjeta">
    <div class="ancho-angosto">
      <h2>Comparar precios de proveedores</h2>
      <p class="subtitulo">Subí el PDF del F.41. El último precio de la vez anterior aparece solo.</p>

      <div class="mensaje" id="mensaje-comparar"></div>

      <form id="formulario-comparar" action="/items_para_comparar" method="post" enctype="multipart/form-data">
        <div class="campo-archivo">
          <label class="etiqueta-campo" for="pdf-comparar">PDF del F.41</label>
          <label class="selector" for="pdf-comparar">
            <span class="nombre" id="nombre-pdf-comparar">Ningún archivo elegido</span>
            <span class="boton-elegir">Elegir PDF</span>
          </label>
          <input type="file" id="pdf-comparar" name="pdf" accept="application/pdf,.pdf" required>
        </div>
      </form>
      <div class="cargando" id="cargando-comparar">Cargando los ítems, un momento…</div>
    </div>

    <!-- Fuera de .ancho-angosto a propósito: para que el "sticky" quede
         pegado mientras se scrollea toda la tarjeta (incluida la grilla de
         abajo), su contenedor de referencia tiene que ser la tarjeta
         entera, no el div corto del formulario. -->
    <div class="fila-botones-comparar">
      <div class="agregar-item-envoltorio">
        <button type="button" id="boton-agregar-item" disabled>+ Agregar ítem</button>
        <div class="panel-agregar-item" id="panel-agregar-item" hidden>
          <input type="text" id="buscador-agregar-item" placeholder="Buscar por renglón, código o descripción…" autocomplete="off">
          <div class="resultados-agregar-item" id="resultados-agregar-item"></div>
        </div>
      </div>
      <button type="submit" form="formulario-comparar" id="boton-comparar">Cargar ítems</button>
      <button type="button" id="boton-guardar-referencia" disabled>Guardar precios de referencia</button>
      <label class="opcion-modo-manual">
        <input type="checkbox" id="checkbox-modo-manual">
        Modo manual (editar todo, incluidas las celdas protegidas). Con esto activo, "Proveedor ganador" no se completa solo.
      </label>
    </div>

    <div id="zona-tabla-comparar"></div>
  </div>

</div>

<script>
  function base64AArchivo(base64, tipoMime) {
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    return new Blob([bytes], { type: tipoMime });
  }

  function mostrarMensaje(el, texto, tipo) {
    el.textContent = texto;
    el.className = 'mensaje ' + tipo;
    el.style.display = 'block';
  }

  function ocultarMensaje(el) {
    el.style.display = 'none';
  }

  // --- Tarjeta 1: convertir PDF a Nota de Pedido / Planilla de Trabajo ---
  const zona = document.getElementById('zona');
  const input = document.getElementById('archivo');
  const nombre = document.getElementById('nombre-archivo');
  const boton = document.getElementById('boton');
  const formulario = document.getElementById('formulario');

  function mostrarArchivo(file) {
    if (!file) return;
    nombre.textContent = '📄 ' + file.name;
    nombre.style.display = 'block';
    boton.disabled = false;
  }

  input.addEventListener('change', () => mostrarArchivo(input.files[0]));

  ['dragenter', 'dragover'].forEach(evento =>
    zona.addEventListener(evento, e => {
      e.preventDefault();
      zona.classList.add('sobre');
    })
  );
  ['dragleave', 'drop'].forEach(evento =>
    zona.addEventListener(evento, e => {
      e.preventDefault();
      zona.classList.remove('sobre');
    })
  );
  zona.addEventListener('drop', e => {
    const archivos = e.dataTransfer.files;
    if (archivos.length) {
      input.files = archivos;
      mostrarArchivo(archivos[0]);
    }
  });

  formulario.addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensaje = document.getElementById('mensaje');
    const cargando = document.getElementById('cargando');
    const resultados = document.getElementById('resultados');

    ocultarMensaje(mensaje);
    resultados.innerHTML = '';
    boton.disabled = true;
    boton.textContent = 'Convirtiendo…';
    cargando.style.display = 'block';

    try {
      const datos = new FormData(formulario);
      const respuesta = await fetch(formulario.action, { method: 'POST', body: datos });
      const cuerpo = await respuesta.json().catch(() => ({}));
      cargando.style.display = 'none';

      if (!respuesta.ok) {
        mostrarMensaje(mensaje, cuerpo.error || 'Ocurrió un error al procesar el archivo.', 'error');
        boton.disabled = false;
        boton.textContent = 'Convertir a Excel';
        return;
      }

      (cuerpo.archivos || []).forEach(archivo => {
        const blob = base64AArchivo(
          archivo.datos,
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        );
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = archivo.nombre;
        enlace.className = 'boton-descarga';
        enlace.textContent = '⬇️ Descargar ' + archivo.etiqueta;
        resultados.appendChild(enlace);
      });

      mostrarMensaje(mensaje, '✅ Listo, descargá los archivos de abajo. Ya podés subir otro PDF.', 'exito');
      formulario.reset();
      nombre.style.display = 'none';
      boton.disabled = true;
      boton.textContent = 'Convertir a Excel';
    } catch (err) {
      cargando.style.display = 'none';
      mostrarMensaje(mensaje, 'No se pudo conectar con la página. Volvé a intentar.', 'error');
      boton.disabled = false;
      boton.textContent = 'Convertir a Excel';
    }
  });

  // --- Tarjeta 2: comparador de precios de proveedores (grilla con fórmulas + base de datos) ---
  const MASCARA_PESOS = { mask: '#.##0,00', decimal: ',' };

  function parsePesos(texto) {
    if (texto === null || texto === undefined) return null;
    texto = String(texto).trim();
    if (texto === '') return null;
    const limpio = texto.replace(/[^0-9,.\-]/g, '').replace(/\./g, '').replace(',', '.');
    if (limpio === '' || limpio === '-') return null;
    const valor = parseFloat(limpio);
    return isNaN(valor) ? null : valor;
  }

  function formatearFecha(iso) {
    if (!iso) return '';
    const partes = String(iso).split('-');
    if (partes.length !== 3) return iso;
    const [anio, mes, dia] = partes;
    return dia + '/' + mes + '/' + anio;
  }

  const formularioComparar = document.getElementById('formulario-comparar');
  const botonComparar = document.getElementById('boton-comparar');
  const botonGuardarReferencia = document.getElementById('boton-guardar-referencia');
  const cargandoComparar = document.getElementById('cargando-comparar');
  const mensajeComparar = document.getElementById('mensaje-comparar');
  const zonaTablaComparar = document.getElementById('zona-tabla-comparar');
  const pdfComparar = document.getElementById('pdf-comparar');
  const nombrePdfComparar = document.getElementById('nombre-pdf-comparar');
  const checkboxModoManual = document.getElementById('checkbox-modo-manual');
  const botonAgregarItem = document.getElementById('boton-agregar-item');
  const panelAgregarItem = document.getElementById('panel-agregar-item');
  const buscadorAgregarItem = document.getElementById('buscador-agregar-item');
  const resultadosAgregarItem = document.getElementById('resultados-agregar-item');

  let worksheetActual = null;
  let itemsActuales = [];
  let otrosItemsActuales = [];
  let tituloActual = '';
  // Apunta al recálculo (proveedor ganador + colores) de la grilla vigente;
  // crearGrillaComparacion lo reasigna cada vez que arma una grilla nueva.
  // Hace falta porque "Agregar ítem" vive fuera de esa función.
  let recalcularTodoActual = () => {};

  // Arma las 18 columnas de una fila de la grilla a partir de un item
  // ({rg, codigo, descripcion, cantidad, ultimo_precio, porcentaje,
  // actualizado, mejor_proveedor}). La usan tanto la carga inicial del
  // PDF como "Agregar ítem" (botón de la izquierda), para no duplicar
  // esta construcción en dos lugares.
  function construirFilaDatos(item, fila) {
    const ultimo = item.ultimo_precio === null || item.ultimo_precio === undefined ? '' : item.ultimo_precio;
    const porcentaje = item.porcentaje === null || item.porcentaje === undefined ? 0 : item.porcentaje;
    return [
      item.rg,
      item.codigo,
      item.descripcion,
      item.cantidad,
      ultimo, // Último precio (de solo lectura, historial)
      formatearFecha(item.actualizado), // Fecha del último guardado (de solo lectura)
      item.mejor_proveedor || '', // Proveedor ganador la última vez que se guardó (de solo lectura)
      ultimo, // Precio de referencia (editable, arranca igual al último precio, no se guarda)
      '', '', '', '',
      '=MIN(I' + fila + ':L' + fila + ')',
      '', // Proveedor ganador en vivo (lo calcula el JS, no es una fórmula de celda)
      porcentaje,
      '=M' + fila + '*((O' + fila + '+100)/100)',
      '=D' + fila + '*P' + fila, // Total de venta = Cantidad x Precio final
      '=D' + fila + '*M' + fila, // Total de costos = Cantidad x Mejor precio nuevo
    ];
  }

  // Columnas que normalmente son de solo lectura (coincide exactamente con
  // los "readOnly: true" de la config de columnas de crearGrillaComparacion).
  const COLUMNAS_SOLO_LECTURA = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'N'];

  function fijarSoloLecturaColumnas(ws, cantidadFilas, modoManualActivo) {
    for (let fila = 1; fila <= cantidadFilas; fila++) {
      for (const letra of COLUMNAS_SOLO_LECTURA) {
        ws.setReadOnly(letra + fila, !modoManualActivo);
      }
    }
  }

  checkboxModoManual.addEventListener('change', () => {
    if (worksheetActual) {
      fijarSoloLecturaColumnas(worksheetActual, itemsActuales.length, checkboxModoManual.checked);
      // Por si alguna fila había quedado con el color de "Precio final"
      // desactualizado (ej. una agregada con "Agregar ítem"), repintar
      // todo apenas se cambia de modo, sin esperar a que se edite otra
      // celda para que se note.
      recalcularTodoActual();
    }
  });

  // --- "Agregar ítem": ítems del mismo PDF que el comparador descarta
  // automáticamente por no ser de las categorías habituales (código sin
  // empezar con 4.01.008/4.01.018), pero que igual se pueden llegar a
  // necesitar cotizar. Salen de "otros_items" (ya vino junto con el PDF,
  // no hace falta pedirle nada más al servidor).
  function normalizarTexto(texto) {
    return (texto || '').toString().toLowerCase();
  }

  function coincideConBusqueda(item, termino) {
    if (!termino) return true;
    return (
      normalizarTexto(item.rg).includes(termino) ||
      normalizarTexto(item.codigo).includes(termino) ||
      normalizarTexto(item.descripcion).includes(termino)
    );
  }

  function renderizarResultadosAgregarItem() {
    const termino = normalizarTexto(buscadorAgregarItem.value.trim());
    resultadosAgregarItem.innerHTML = '';

    if (!otrosItemsActuales.length) {
      const vacio = document.createElement('p');
      vacio.className = 'resultado-agregar-item-vacio';
      vacio.textContent = 'Este PDF no tiene otros ítems para agregar (ya están todos en la grilla).';
      resultadosAgregarItem.appendChild(vacio);
      return;
    }

    const filtrados = otrosItemsActuales.filter(it => coincideConBusqueda(it, termino)).slice(0, 30);
    if (!filtrados.length) {
      const vacio = document.createElement('p');
      vacio.className = 'resultado-agregar-item-vacio';
      vacio.textContent = 'No se encontró ningún ítem con eso.';
      resultadosAgregarItem.appendChild(vacio);
      return;
    }

    filtrados.forEach(it => {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.className = 'resultado-agregar-item';
      const encabezado = document.createElement('strong');
      encabezado.textContent = 'Rg. ' + it.rg + ' — ' + it.codigo;
      boton.appendChild(encabezado);
      boton.appendChild(document.createElement('br'));
      boton.appendChild(document.createTextNode(it.descripcion));
      boton.addEventListener('click', () => agregarItemAGrilla(it));
      resultadosAgregarItem.appendChild(boton);
    });
  }

  function abrirPanelAgregarItem() {
    panelAgregarItem.hidden = false;
    buscadorAgregarItem.value = '';
    renderizarResultadosAgregarItem();
    buscadorAgregarItem.focus();
  }

  function cerrarPanelAgregarItem() {
    panelAgregarItem.hidden = true;
  }

  function agregarItemAGrilla(it) {
    if (!worksheetActual) return;
    const filaNueva = itemsActuales.length + 1;
    worksheetActual.insertRow(construirFilaDatos(it, filaNueva));
    itemsActuales.push(it);
    otrosItemsActuales = otrosItemsActuales.filter(otro => otro !== it);
    fijarSoloLecturaColumnas(worksheetActual, itemsActuales.length, checkboxModoManual.checked);
    recalcularTodoActual();
    cerrarPanelAgregarItem();
    mostrarMensaje(mensajeComparar, 'Se agregó el renglón ' + it.rg + ' (' + it.codigo + ') al final de la grilla.', 'exito');
  }

  botonAgregarItem.addEventListener('click', () => {
    if (panelAgregarItem.hidden) abrirPanelAgregarItem();
    else cerrarPanelAgregarItem();
  });
  buscadorAgregarItem.addEventListener('input', renderizarResultadosAgregarItem);
  buscadorAgregarItem.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cerrarPanelAgregarItem();
  });
  document.addEventListener('click', (e) => {
    if (!panelAgregarItem.hidden && !e.target.closest('.agregar-item-envoltorio')) {
      cerrarPanelAgregarItem();
    }
  });

  pdfComparar.addEventListener('change', () => {
    nombrePdfComparar.textContent = pdfComparar.files[0] ? pdfComparar.files[0].name : 'Ningún archivo elegido';
  });

  function crearGrillaComparacion(titulo, items) {
    zonaTablaComparar.innerHTML = '';
    itemsActuales = items;
    tituloActual = titulo;
    // Cada PDF cargado arranca protegido: el modo manual no se arrastra
    // de una carga a la siguiente.
    checkboxModoManual.checked = false;

    const tituloEl = document.createElement('p');
    tituloEl.className = 'titulo-comparacion';
    tituloEl.textContent = titulo;
    zonaTablaComparar.appendChild(tituloEl);

    const envoltorio = document.createElement('div');
    envoltorio.className = 'grilla-comparacion-wrap';
    zonaTablaComparar.appendChild(envoltorio);

    const datos = items.map((item, indice) => construirFilaDatos(item, indice + 1));

    const manejarEventoGrilla = (nombreEvento, instancia) => {
      if (nombreEvento === 'onafterchanges' || nombreEvento === 'onchange' || nombreEvento === 'onchangeheader') {
        recalcularTodo(instancia);
      }
    };

    const instancias = jspreadsheet(envoltorio, {
      onevent: manejarEventoGrilla,
      worksheets: [
        {
          data: datos,
          columnSorting: false,
          onevent: manejarEventoGrilla,
          // La grilla pasa a tener su propio scroll interno (como un
          // Excel real), en vez de que se scrollee toda la página: así
          // el encabezado de columnas queda fijo usando el sticky que
          // jspreadsheet ya trae de fábrica para este caso (confirmado
          // leyendo jspreadsheet.css: ".jss_worksheet > thead > tr > td"
          // ya es "position: sticky; top: 0" ahí adentro), y de paso el
          // scroll horizontal para ver las columnas de la derecha queda
          // contenido en la grilla en vez de mover toda la página.
          tableOverflow: true,
          tableWidth: '100%',
          tableHeight: '65vh',
          columns: [
            { type: 'numeric', title: 'Renglón', width: 70, readOnly: true },
            { type: 'text', title: 'Código', width: 100, readOnly: true },
            { type: 'text', title: 'Descripción', width: 320, readOnly: true, align: 'left', wordWrap: true },
            { type: 'numeric', title: 'Cantidad', width: 80, readOnly: true },
            Object.assign({ type: 'text', title: 'Último precio', width: 120, readOnly: true }, MASCARA_PESOS),
            { type: 'text', title: 'Actualizado', width: 100, readOnly: true },
            { type: 'text', title: 'Mejor proveedor', width: 150, readOnly: true },
            Object.assign({ type: 'text', title: 'Precio de referencia', width: 140 }, MASCARA_PESOS),
            Object.assign({ type: 'text', title: 'Proveedor 1', width: 120 }, MASCARA_PESOS),
            Object.assign({ type: 'text', title: 'Proveedor 2', width: 120 }, MASCARA_PESOS),
            Object.assign({ type: 'text', title: 'Proveedor 3', width: 120 }, MASCARA_PESOS),
            Object.assign({ type: 'text', title: 'Proveedor 4', width: 120 }, MASCARA_PESOS),
            Object.assign({ type: 'text', title: 'Mejor precio nuevo', width: 140 }, MASCARA_PESOS),
            { type: 'text', title: 'Proveedor ganador', width: 150, readOnly: true },
            // decimal:',' (sin mask) para que el motor de fórmulas de
            // jspreadsheet interprete la coma como separador decimal al
            // usar esta celda en la fórmula de "Precio final" — sin esto,
            // un valor como "24,8" se calculaba mal (terminaba usando 248,
            // confirmado leyendo parseNumber() en el bundle fuente). No
            // lleva mask porque no queremos reformatear lo que se tipea.
            { type: 'text', title: '%', width: 70, decimal: ',' },
            Object.assign({ type: 'text', title: 'Precio final', width: 130 }, MASCARA_PESOS),
            Object.assign({ type: 'text', title: 'Total de venta', width: 140 }, MASCARA_PESOS),
            Object.assign({ type: 'text', title: 'Total de costos', width: 140 }, MASCARA_PESOS),
          ],
        },
      ],
    });
    worksheetActual = instancias[0];

    // ws.setValue(...) dispara el mismo evento "onafterchanges" que un
    // cambio hecho por el usuario (confirmado leyendo el código fuente de
    // jspreadsheet: setValue termina llamando a dispatch("onafterchanges")
    // igual que una edición manual). Como actualizarProveedorGanador usa
    // setValue para escribir la columna N, sin esta traba cada recálculo
    // volvía a disparar el evento que lo llama de nuevo -> bucle infinito
    // que congelaba la grilla apenas se cargaba un precio de proveedor.
    let recalculando = false;
    const recalcularTodo = (ws) => {
      if (recalculando) return;
      recalculando = true;
      try {
        for (let indice = 0; indice < itemsActuales.length; indice++) {
          actualizarProveedorGanador(ws, indice + 1);
          actualizarColorPrecioFinal(ws, indice + 1);
        }
      } finally {
        recalculando = false;
      }
    };
    const recalcularTodosLosColores = () => recalcularTodo(worksheetActual);
    recalcularTodoActual = recalcularTodosLosColores;
    recalcularTodosLosColores();
    // Además de onevent/onchange/onchangeheader de jspreadsheet, escuchamos
    // directo los eventos del DOM dentro de la grilla (por si el evento
    // propio de la librería no llega a dispararse en esta versión) para
    // que todo se recalcule sí o sí apenas se tipea, se sale de una celda
    // o se renombra un proveedor.
    envoltorio.addEventListener('keyup', recalcularTodosLosColores);
    envoltorio.addEventListener('blur', recalcularTodosLosColores, true);
    envoltorio.addEventListener('click', recalcularTodosLosColores);

    const ayuda = document.createElement('p');
    ayuda.className = 'ayuda-formulas';
    ayuda.textContent = 'Es una grilla como Excel: podés escribir fórmulas en cualquier celda. Precio final = Mejor precio nuevo + ese % de aumento. Ej.: dejá 0 para el mismo precio, poné 20 para sumarle un 20%. El Precio final aparece en verde si queda por debajo del Precio de referencia, y en rojo si queda igual o por arriba.';
    zonaTablaComparar.appendChild(ayuda);

    const botonDescargarExcel = document.createElement('button');
    botonDescargarExcel.type = 'button';
    botonDescargarExcel.className = 'boton-descarga-discreta';
    botonDescargarExcel.textContent = 'Descargar esta comparación como Excel';
    botonDescargarExcel.addEventListener('click', descargarExcelComparacion);
    zonaTablaComparar.appendChild(botonDescargarExcel);

    botonGuardarReferencia.disabled = false;
    botonAgregarItem.disabled = false;
  }

  async function descargarExcelComparacion(evento) {
    if (!worksheetActual) return;
    const boton = evento.currentTarget;
    boton.disabled = true;
    boton.textContent = 'Generando…';

    try {
      const filas = worksheetActual.getData();
      const respuesta = await fetch('/exportar_comparacion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titulo: tituloActual, filas: filas }),
      });
      const cuerpo = await respuesta.json().catch(() => ({}));
      if (!respuesta.ok) {
        mostrarMensaje(mensajeComparar, cuerpo.error || 'No se pudo generar el Excel.', 'error');
      } else {
        const archivo = cuerpo.archivos[0];
        const blob = base64AArchivo(
          archivo.datos,
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        );
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement('a');
        enlace.href = url;
        enlace.download = archivo.nombre;
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
        URL.revokeObjectURL(url);
      }
    } catch (err) {
      mostrarMensaje(mensajeComparar, 'No se pudo conectar con la página. Volvé a intentar.', 'error');
    }
    boton.disabled = false;
    boton.textContent = 'Descargar esta comparación como Excel';
  }

  // Columnas Proveedor 1-4 (letra de la grilla -> índice 0-based de jspreadsheet).
  const COLUMNAS_PROVEEDORES = [
    { letra: 'I', indice: 8 },
    { letra: 'J', indice: 9 },
    { letra: 'K', indice: 10 },
    { letra: 'L', indice: 11 },
  ];

  function algunProveedorCargado(ws, fila) {
    return COLUMNAS_PROVEEDORES.some(p => (ws.getValue(p.letra + fila) || '').toString().trim() !== '');
  }

  function pintarCelda(ws, cel, fondo, letra) {
    ws.setStyle(cel, 'background-color', fondo);
    ws.setStyle(cel, 'color', letra);
  }

  function actualizarProveedorGanador(ws, fila) {
    // En modo manual, "Proveedor ganador" pasa a ser editable a mano; si
    // siguiéramos recalculándola acá, el próximo recálculo (disparado por
    // cualquier tecleo en cualquier celda) pisaría lo que el usuario
    // acaba de escribir.
    if (checkboxModoManual.checked) return;
    let ganador = null;
    let menorPrecio = null;
    for (const p of COLUMNAS_PROVEEDORES) {
      const valor = parsePesos(ws.getValue(p.letra + fila, true));
      if (valor === null) continue;
      if (menorPrecio === null || valor < menorPrecio) {
        menorPrecio = valor;
        ganador = p;
      }
    }
    const nuevoValor = ganador ? ws.getHeader(ganador.indice) : '';
    // Solo escribir si cambió: setValue dispara "onafterchanges" (mismo
    // evento que un cambio manual) y suma una entrada al historial de
    // deshacer, así que escribir sin necesidad en cada recálculo ensucia
    // el Ctrl+Z además de disparar recálculos de más.
    if ((ws.getValue('N' + fila) || '') !== nuevoValor) {
      // El 3er parámetro (force=true) es necesario: "Proveedor ganador" es
      // de solo lectura (readOnly), y sin este flag jspreadsheet ignora en
      // silencio cualquier setValue sobre una celda readonly (confirmado
      // leyendo updateCell() en el bundle fuente).
      ws.setValue('N' + fila, nuevoValor, true);
    }
  }

  function actualizarColorPrecioFinal(ws, fila) {
    const cel = 'P' + fila;
    if (!algunProveedorCargado(ws, fila)) {
      pintarCelda(ws, cel, '', '');
      return;
    }
    const referencia = parsePesos(ws.getValue('H' + fila, true));
    const final = parsePesos(ws.getValue(cel, true));
    if (referencia === null || final === null) {
      pintarCelda(ws, cel, '', '');
      return;
    }
    if (final < referencia) {
      pintarCelda(ws, cel, '#d4f4dd', '#1e7a46');
    } else {
      pintarCelda(ws, cel, '#fbdcda', '#a3231c');
    }
  }

  function leerFilaParaGuardar(item, indice) {
    const fila = indice + 1;
    const rawFinal = (worksheetActual.getValue('P' + fila) || '').toString().trim();
    const esValorPorDefecto = rawFinal === ('=M' + fila + '*((O' + fila + '+100)/100)');

    if (!algunProveedorCargado(worksheetActual, fila) && esValorPorDefecto) {
      return null; // fila sin cotizar todavía, no se guarda (evita guardar un precio fantasma)
    }

    const precioFinal = parsePesos(worksheetActual.getValue('P' + fila, true));
    if (precioFinal === null) return null;

    // Sin el 2do parámetro (a diferencia de las demás lecturas de esta
    // función): esta columna no tiene mask, así que getValue(cel, true)
    // (que devuelve el HTML renderizado) y getValue(cel) (que devuelve el
    // dato crudo guardado) dan lo mismo hoy, pero para algo que se va a
    // guardar en la base es más correcto leer el dato crudo, no depender
    // de cómo se renderizó la celda en pantalla.
    const porcentaje = parsePesos(worksheetActual.getValue('O' + fila));
    const mejorProveedor = (worksheetActual.getValue('N' + fila) || '').toString().trim() || null;

    return {
      codigo: item.codigo,
      descripcion: item.descripcion,
      ultimo_precio: precioFinal,
      porcentaje: porcentaje,
      mejor_proveedor: mejorProveedor,
    };
  }

  async function guardarReferencia() {
    if (!worksheetActual) return;
    const boton = botonGuardarReferencia;
    const itemsAGuardar = itemsActuales
      .map((item, indice) => leerFilaParaGuardar(item, indice))
      .filter(Boolean);

    if (!itemsAGuardar.length) {
      mostrarMensaje(mensajeComparar, 'Completá al menos un precio final antes de guardar.', 'error');
      return;
    }

    boton.disabled = true;
    boton.textContent = 'Guardando…';
    try {
      const respuesta = await fetch('/guardar_referencia', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: itemsAGuardar }),
      });
      const cuerpo = await respuesta.json().catch(() => ({}));
      if (!respuesta.ok) {
        mostrarMensaje(mensajeComparar, cuerpo.error || 'Ocurrió un error al guardar.', 'error');
      } else {
        mostrarMensaje(mensajeComparar, '✅ Se guardaron ' + cuerpo.cantidad + ' precio(s) de referencia.', 'exito');
      }
    } catch (err) {
      mostrarMensaje(mensajeComparar, 'No se pudo conectar con la página. Volvé a intentar.', 'error');
    }
    boton.disabled = false;
    boton.textContent = 'Guardar precios de referencia';
  }

  botonGuardarReferencia.addEventListener('click', guardarReferencia);

  formularioComparar.addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarMensaje(mensajeComparar);
    zonaTablaComparar.innerHTML = '';
    worksheetActual = null;
    otrosItemsActuales = [];
    cerrarPanelAgregarItem();
    botonGuardarReferencia.disabled = true;
    botonAgregarItem.disabled = true;
    botonComparar.disabled = true;
    botonComparar.textContent = 'Cargando…';
    cargandoComparar.style.display = 'block';

    try {
      const datos = new FormData(formularioComparar);
      const respuesta = await fetch('/items_para_comparar', { method: 'POST', body: datos });
      const cuerpo = await respuesta.json().catch(() => ({}));
      cargandoComparar.style.display = 'none';

      if (!respuesta.ok) {
        mostrarMensaje(mensajeComparar, cuerpo.error || 'Ocurrió un error al procesar el archivo.', 'error');
      } else {
        otrosItemsActuales = cuerpo.otros_items || [];
        crearGrillaComparacion(cuerpo.titulo, cuerpo.items);
      }
    } catch (err) {
      cargandoComparar.style.display = 'none';
      mostrarMensaje(mensajeComparar, 'No se pudo conectar con la página. Volvé a intentar.', 'error');
    }
    botonComparar.disabled = false;
    botonComparar.textContent = 'Cargar ítems';
  });
</script>
</body>
</html>
